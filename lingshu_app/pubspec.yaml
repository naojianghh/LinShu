name: lingshu_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  go_router: ^14.1.0
  dio: ^5.4.1
  intl: ^0.20.2
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  sqflite: ^2.3.3+1
  flutter_dotenv: ^5.1.0
  path: ^1.9.0
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  flutter_screenutil: ^5.9.3
  logger: ^2.3.0
  camera: ^0.10.5+5
  google_mlkit_pose_detection: ^0.12.0
  permission_handler: ^11.3.1
  google_mlkit_commons: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/lingshu_logo_new.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/goddess_new/
    - assets/video/
    - assets/fonts/
    - .env
  fonts:
    - family: STXinwei
      fonts:
        - asset: assets/fonts/STXinwei.ttf
    - family: STKaiti
      fonts:
        - asset: assets/fonts/STKaiti.ttf
    - family: FZZJ-LongYTJW
      fonts:
        - asset: assets/fonts/FZZJ-LongYTJW.ttf