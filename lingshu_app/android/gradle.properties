org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# 网络配置
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# 网络超时设置
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000

# Maven 镜像配置
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=

# 阿里云镜像
systemProp.org.gradle.mirror=https://maven.aliyun.com/repository/public
systemProp.org.gradle.mirror.google=https://maven.aliyun.com/repository/google
systemProp.org.gradle.mirror.central=https://maven.aliyun.com/repository/central
